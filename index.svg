<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">my-svg</title>
  <desc id="desc">A working static SVG page for the my-svg repository.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />

  <g transform="translate(600 400)">
    <circle r="250" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
    <path d="M-120 80 C -60 -110, 60 -110, 120 80 L 120 130 L -120 130 Z" fill="rgba(255,255,255,0.25)"/>
    <path d="M-110 30 L 0 -110 L 110 30" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-150" r="34" fill="#f8fafc" opacity="0.95"/>
    <path d="M-28 30 L 0 120 L 28 30 Z" fill="#f8fafc" opacity="0.9"/>
  </g>

  <g text-anchor="middle" fill="#f8fafc">
    <text x="600" y="620" font-size="72" font-family="Segoe UI, Arial, sans-serif" font-weight="700">my-svg</text>
    <text x="600" y="680" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#dbeafe">Working again</text>
  </g>
</svg>
