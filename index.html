<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-svg</title>
    <style>
      :root {
        --bg: #050816;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-border: rgba(148, 163, 184, 0.35);
        --text: #e2e8f0;
        --muted: #a5b4cf;
        --accent: #60a5fa;
        --warning: #fbbf24;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      #app {
        position: relative;
        width: min(1100px, 100%);
        height: min(760px, 82vh);
        border-radius: 20px;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }

      #toolbar {
        position: absolute;
        inset: 0 0 auto 0;
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px 0 18px;
        background: rgba(15, 23, 42, 0.78);
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        z-index: 2;
        backdrop-filter: blur(8px);
      }

      #status {
        color: var(--text);
        font-size: 1.05rem;
        letter-spacing: 0.03em;
      }

      #status.error {
        color: var(--warning);
      }

      #retry {
        appearance: none;
        border: 1px solid rgba(96, 165, 250, 0.75);
        background: rgba(37, 99, 235, 0.18);
        color: var(--text);
        font-size: 0.95rem;
        padding: 0.7rem 1.1rem;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      #retry:hover {
        transform: translateY(-1px);
        background: rgba(59, 130, 246, 0.28);
      }

      #frame {
        position: absolute;
        inset: 74px 0 0 0;
        width: 100%;
        height: calc(100% - 74px);
        border: 0;
        background: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div id="status">Connecting…</div>
        <button id="retry" type="button">Try again</button>
      </div>
      <iframe id="frame" title="App content" allow="fullscreen" loading="eager"></iframe>
    </div>

    <script>
      (function () {
        'use strict';

        const ENTRY = 'index.svg';
        const LAST_KEY = '__lx_m';
        const PIN_KEY = '__lx_p';
        const PIN_TTL = 250000;
        const statusEl = document.getElementById('status');
        const retryEl = document.getElementById('retry');
        const frameEl = document.getElementById('frame');

        const mirrors = [
          'https://cdn.jsdelivr.net/gh/minasonchicabison/my-svg@main/',
          'https://raw.githubusercontent.com/minasonchicabison/my-svg/main/',
          'https://cdn.jsdelivr.net/gh/minasonchicabison/my-svg/',
          'https://raw.githack.com/minasonchicabison/my-svg/main/',
          'https://github.com/minasonchicabison/my-svg/raw/main/'
        ];

        function setStatus(text, isError) {
          statusEl.textContent = text;
          statusEl.classList.toggle('error', Boolean(isError));
        }

        function storeLast(base) {
          try {
            localStorage.setItem(LAST_KEY, base);
          } catch (err) {
            // ignore storage failures; the app can still run without persistence
          }
        }

        function readLast() {
          try {
            return localStorage.getItem(LAST_KEY) || null;
          } catch (err) {
            return null;
          }
        }

        function storePin(value) {
          try {
            localStorage.setItem(PIN_KEY, JSON.stringify({ s: value, t: Date.now() }));
          } catch (err) {
            // ignore storage failures
          }
        }

        function orderMirrors() {
          const last = readLast();
          if (!last) return mirrors.slice();
          const copy = mirrors.slice();
          const index = copy.indexOf(last);
          if (index > 0) {
            copy.push(...copy.splice(0, index));
          }
          return copy;
        }

        function pinnedMirrors(list, sha) {
          if (!sha) return list;
          const out = [];
          list.forEach((base) => {
            const pinned = base.replace(/@main\//, '@' + sha + '/');
            if (pinned !== base) {
              out.push(pinned);
            }
          });
          return out.concat(list);
        }

        function probe(base, signal) {
          const url = new URL(base + ENTRY);
          url.searchParams.set('t', Date.now().toString(36));

          return fetch(url.toString(), {
            cache: 'no-store',
            credentials: 'omit',
            mode: 'cors',
            signal
          }).then((response) => {
            if (!response.ok) {
              throw new Error(String(response.status));
            }
            return response.text();
          }).then((text) => {
            const source = String(text || '');
            if (source.indexOf('<svg') === -1 && source.indexOf('<foreignObject') === -1) {
              throw new Error('not-the-app');
            }
            return base;
          });
        }

        function headSha() {
          const apiUrl = 'https://api.github.com/repos/minasonchicabison/my-svg';
          return fetch(apiUrl, {
            headers: { Accept: 'application/vnd.github.sha' },
            cache: 'no-store',
            credentials: 'omit'
          }).then((response) => {
            if (!response.ok) {
              return '';
            }
            return response.text();
          }).then((sha) => {
            const clean = String(sha || '').trim();
            if (!/^[0-9a-f]{40}$/.test(clean)) {
              return '';
            }
            storePin(clean);
            return clean;
          }).catch(() => '');
        }

        function race(list) {
          return new Promise((resolve, reject) => {
            let index = 0;
            let done = false;
            let timer = 0;
            const live = [];

            function failSlowly() {
              if (done) return;
              if (index < list.length) {
                index += 1;
              }
              if (index >= list.length && !live.length) {
                done = true;
                reject(new Error('no mirrors available'));
              }
            }

            function next() {
              clearTimeout(timer);
              if (done || index >= list.length) return;

              const base = list[index++];
              const controller = new AbortController();
              live.push(controller);

              probe(base, controller.signal).then((resolvedBase) => {
                if (done) return;
                done = true;
                live.forEach((item) => item.abort());
                resolve(resolvedBase);
              }, () => {
                const found = live.indexOf(controller);
                if (found >= 0) live.splice(found, 1);
                failSlowly();
                if (!done && index < list.length) {
                  timer = setTimeout(next, 150);
                }
              });
            }

            next();
          });
        }

        function show(base) {
          storeLast(base);

          const url = new URL(base + ENTRY);
          url.searchParams.set('t', Date.now().toString(36));

          frameEl.src = url.toString();
          setStatus('Loaded', false);
        }

        function fail() {
          setStatus('Could not reach the app from here. Check your connection and try again.', true);
        }

        function start() {
          setStatus('Connecting…', false);
          headSha().then((sha) => {
            return race(pinnedMirrors(orderMirrors(), sha));
          }).then((base) => {
            show(base);
          }).catch(() => {
            fail();
          });
        }

        retryEl.addEventListener('click', start);
        start();
      })();
    </script>
  </body>
</html>
